name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build exe
        run: pyinstaller --noconfirm --clean --windowed --name FB2TranslationEditor --icon assets\icon.ico run.pyw

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\FB2TranslationEditor -DestinationPath FB2TranslationEditor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FB2TranslationEditor-windows
          path: dist/FB2TranslationEditor

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FB2TranslationEditor-windows.zip
